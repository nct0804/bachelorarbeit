name: Robot Framework Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Robot test suite or directory"
        required: false
        default: "robot-tests"
      headless:
        description: "Run browser headless (True/False)"
        required: false
        default: "True"

jobs:
  robot:
    name: Run Robot Framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 0.0.0.0 --port 4242 &
          sleep 5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Robot Framework + Libraries
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-browser robotframework-seleniumlibrary
          rfbrowser init

      - name: Run Robot Tests
        run: |
          mkdir -p Results
          robot --outputdir Results --variable HEADLESS:${{ inputs.headless }} ${{ inputs.suite }}

      - name: Upload Robot Results
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: Results
