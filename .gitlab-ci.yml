stages:
  - robot

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  ROBOT_OUTPUT_DIR: "Results"
  ROBOT_SUITE: "robot-tests"
  ROBOT_HEADLESS: "True"
  ROBOT_TESTCASE: ""
  ROBOT_VARIABLES: ""
  VITE_CLERK_PUBLISHABLE_KEY: "pk_test_aW1tdW5lLWhlcm9uLTMwLmNsZXJrLmFjY291bnRzLmRldiQ"

cache:
  paths:
    - .cache/pip
    - frontend/node_modules

robot_tests:
  stage: robot
  image: node:20-bullseye
  services: []
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip curl
    - python3 -m pip install --upgrade pip
    - pip install robotframework robotframework-browser robotframework-seleniumlibrary
    - rfbrowser init
    - npx --yes playwright install --with-deps
  script:
    - cd frontend
    - npm ci
    - npm run dev -- --host 0.0.0.0 --port 4242 &
    - cd ..
    - |
      for i in $(seq 1 60); do
        if curl -sf http://localhost:4242/ > /dev/null; then
          echo "Frontend is ready."
          break
        fi
        echo "Waiting for frontend to be ready... (${i}/60)"
        sleep 1
      done
      curl -sf http://localhost:4242/ > /dev/null
    - mkdir -p "$ROBOT_OUTPUT_DIR"
    - |
      if [ -n "$ROBOT_TESTCASE" ]; then
        echo "Running single test: $ROBOT_TESTCASE"
        robot --outputdir "$ROBOT_OUTPUT_DIR" --variable HEADLESS:$ROBOT_HEADLESS $ROBOT_VARIABLES --test "$ROBOT_TESTCASE" $ROBOT_SUITE
      else
        echo "Running full suite: $ROBOT_SUITE"
        robot --outputdir "$ROBOT_OUTPUT_DIR" --variable HEADLESS:$ROBOT_HEADLESS $ROBOT_VARIABLES $ROBOT_SUITE
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - $ROBOT_OUTPUT_DIR
  rules:
    - when: manual
